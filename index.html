<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bug-Farm</title>
  <link rel="icon" type="image/svg+xml" href="assets/bug-farm-icon.svg">
  <meta name="description" content="A Nexios tower defense game: React, Java and .NET developers squash bugs before they reach production.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <div id="play">
      <div id="stage">
        <canvas id="game" aria-label="Game board"></canvas>
        <div id="overlay"></div>
        <div class="pause-veil">Paused · press P to resume</div>
      </div>
      <aside id="side-panel" aria-label="Your run">
        <div class="sp-inner">
          <section id="panel-building" class="sp-sec"></section>
          <section id="panel-devs" class="sp-sec"></section>
          <section id="panel-tasks" class="sp-sec sp-tasks"></section>
        </div>
      </aside>
    </div>
    <section id="powerups" aria-label="Power-ups"></section>
    <section id="hire" aria-label="Hire developers"></section>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
