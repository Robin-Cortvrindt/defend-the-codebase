<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defend the Codebase</title>
  <meta name="description" content="A Nexios tower defense game: React, Java and .NET developers squash bugs before they reach production.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <div id="stage">
      <canvas id="game" aria-label="Game board"></canvas>
      <div id="overlay"></div>
      <div class="pause-veil">Paused · press P to resume</div>
    </div>
    <section id="powerups" aria-label="Power-ups"></section>
    <section id="hire" aria-label="Hire developers"></section>
    <footer class="help">1 2 3 hire · shift-click to keep hiring · right-click or Esc cancels · Space starts the wave or rings the bell · P pause · F speed · M sound</footer>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
