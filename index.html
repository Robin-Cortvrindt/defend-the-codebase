<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defend the Codebase</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #001E32; color: #fff; font-family: Lato, system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; max-width: 640px; margin: 0 auto; box-sizing: border-box; }
    img { height: 24px; max-height: 24px; width: auto; align-self: flex-start; }
    .dash { width: 28px; height: 3px; background: #16A34A; margin: 40px 0 20px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #94A3B8; }
    h1 { font-size: clamp(36px, 8vw, 62px); font-weight: 900; line-height: 1.05; margin: 10px 0 16px; }
    p { color: #E2E8F0; font-size: 17px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <main>
    <img src="assets/nexios-wordmark-white.webp" alt="Nexios">
    <div class="dash"></div>
    <div class="eyebrow">Intent Engineering Bootcamp · Day 5</div>
    <h1>Defend the Codebase</h1>
    <p>Bugs are on their way to production. The game is being built — check back soon.</p>
  </main>
</body>
</html>
